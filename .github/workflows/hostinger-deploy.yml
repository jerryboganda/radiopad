name: hostinger-deploy

# Builds the two static surfaces on GitHub Actions and rsyncs them to Hostinger
# web hosting (Unlimited plan, LiteSpeed):
#   marketing (Astro, marketing/)                 → radiopadstudio.com (+ www)
#   admin web app (Next.js, RADIOPAD_SURFACE=web) → admin.radiopadstudio.com
# The API stays on the VPS at https://api.radiopadstudio.com (Hostinger web
# hosting cannot run .NET) — the web build bakes it in via NEXT_PUBLIC_API_BASE.
#
# Secrets: HOSTINGER_SSH_KEY (private half of the `radiopad-hostinger-deploy`
# key registered in hPanel → SSH access). Host/port/user are not secret.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'marketing/**'
      - 'CHANGELOG.md'        # rendered by marketing /changelog/
      - 'rulebooks/*.yaml'    # counted by marketing /product/validation/
      - 'deploy/hostinger/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/hostinger-deploy.yml'
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HOSTINGER_HOST: 46.202.138.251
  HOSTINGER_PORT: '65002'
  HOSTINGER_USER: u372263031
  # hPanel → SSH access → Host key fingerprint (ED25519). Pinned so a spoofed
  # host can never receive a deploy.
  HOSTINGER_HOSTKEY_SHA256: 'SHA256:MMyZJyHe7HjLzIOHkHaTtOnG3oFdd5xY2UkBDXQUQsc'
  API_BASE: https://api.radiopadstudio.com

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm 9
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile --filter @radiopad/frontend --filter @radiopad/marketing

      - name: Build admin web app (web surface)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE: ${{ env.API_BASE }}
        run: |
          pnpm --filter @radiopad/frontend build:web
          cp deploy/hostinger/web.htaccess frontend/out-web/.htaccess
          test -f frontend/out-web/index.html

      - name: Build marketing site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @radiopad/marketing build
          cp deploy/hostinger/marketing.htaccess marketing/dist/.htaccess
          test -f marketing/dist/index.html

      - name: Configure SSH (pinned host key)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger && chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "$HOSTINGER_PORT" -t ed25519 "$HOSTINGER_HOST" > /tmp/hk 2>/dev/null
          got=$(ssh-keygen -lf /tmp/hk | awk '{print $2}')
          if [ "$got" != "$HOSTINGER_HOSTKEY_SHA256" ]; then
            echo "::error::Hostinger host key mismatch ($got)"; exit 1
          fi
          cat /tmp/hk >> ~/.ssh/known_hosts

      - name: Upload to Hostinger
        run: |
          SSH="ssh -p $HOSTINGER_PORT -i ~/.ssh/hostinger -o IdentitiesOnly=yes"
          DEST="$HOSTINGER_USER@$HOSTINGER_HOST:domains"
          rsync -az --delete -e "$SSH" frontend/out-web/ "$DEST/admin.radiopadstudio.com/public_html/"
          rsync -az --delete -e "$SSH" marketing/dist/ "$DEST/radiopadstudio.com/public_html/"

      - name: Smoke test (direct to Hostinger origin)
        run: |
          for h in radiopadstudio.com admin.radiopadstudio.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --resolve "$h:80:$HOSTINGER_HOST" "http://$h/" -H 'X-Forwarded-Proto: https')
            echo "$h → $code"; [ "$code" = 200 ] || exit 1
          done
